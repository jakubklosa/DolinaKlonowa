name: CI/CD Pipeline - Docker & Host

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Sprawdzanie jakości kodu i poprawności buildu
  test-and-build:
    name: Test & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci || npm install

      - name: Sprawdzenie typów i budowanie aplikacji
        run: npm run build

  # 2. Budowanie obrazu Docker i publikacja do GitHub Container Registry (GHCR)
  docker-build-push:
    name: Build & Push Docker Image
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Docker Buildx (akceleracja i multi-arch)
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ekstrakcja metadanych dla Dockera (tagi, etykiety)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Budowa i wysłanie obrazu Docker (Push do GHCR)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Opcjonalny krok automatycznego wdrożenia na własny serwer VPS przez SSH
  # Aby go aktywować, dodaj sekrety w GitHub: Settings -> Secrets and variables -> Actions
  # (VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, VPS_PORT opcjonalnie)
  deploy-vps:
    name: Deploy to VPS
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdzenie konfiguracji wdrożenia
        run: |
          echo "Jeśli chcesz automatycznie deployować na serwer VPS po każdym pushu:"
          echo "Skonfiguruj sekrety w GitHub (Settings -> Secrets):"
          echo "- VPS_HOST (IP lub domena serwera)"
          echo "- VPS_USERNAME (np. root lub ubuntu)"
          echo "- VPS_SSH_KEY (klucz prywatny SSH)"
          echo "Obraz jest dostępny publicznie w GHCR: ghcr.io/${{ github.repository }}:latest"

      # Krok wykonania komend na serwerze VPS:
      - name: Wykonanie komend na serwerze VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop dolina_klonowa_app || true
            docker rm dolina_klonowa_app || true
            docker run -d --name dolina_klonowa_app -p 80:80 --restart unless-stopped ghcr.io/${{ github.repository }}:latest
